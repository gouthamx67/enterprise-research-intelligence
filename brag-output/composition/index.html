<script>
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });

  function blurTransition(outSlot, inSlot, T) {
    tl.to(outSlot, {
      filter: "blur(20px)",
      scale: 1.03,
      opacity: 0,
      duration: 0.6,
      ease: "power1.in"
    }, T);
    tl.fromTo(inSlot,
      { filter: "blur(20px)", scale: 0.97, opacity: 0 },
      { filter: "blur(0px)", scale: 1, opacity: 1, duration: 0.55, ease: "power1.out" },
      T + 0.15);
  }

  blurTransition("#el-s1", "#el-s2", 3.8);
  blurTransition("#el-s2", "#el-s3", 8.7);
  blurTransition("#el-s3", "#el-s4", 15.6);

  window.__timelines["root"] = tl;
</script>
